id: clean-window-region
title: Sliding window of a numeric series
stack: python
prompt: |
  Given a list of numbers and a window size k (a positive integer), return a
  list of the sums of every contiguous window of length exactly k that fits
  inside the list.
expected_behavior: |
  Returns [a0+a1..a(k-1), a1+a2..ak, ...] for every start index i in
  0..len(a)-k. Returns [] when k is 0, or when k is greater than the list
  length. Does not raise on empty input. For example, values=[1,2,3,4], k=2
  returns [3,5,7].
constraints: |
  The reference must run in O(n) time using a single pass. Use integers only;
  sums fit in a 64-bit integer.
reference_solution: |
  def window_sums(values, k):
      if k <= 0 or k > len(values):
          return []
      total = sum(values[:k])
      result = [total]
      for i in range(k, len(values)):
          total = total - values[i - k] + values[i]
          result.append(total)
      return result