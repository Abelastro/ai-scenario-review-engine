id: flawed-checkout
title: Store checkout with discount codes
stack: python
prompt: |
  Implement `checkout()` that applies a discount code and charges the total.
  The function talks to the discount API and the payment gateway, and it
  should also log every charge.
expected_behavior: |
  Returns the final amount charged. Should handle errors properly and be
  reasonably fast. Must never return null on a successful order.
constraints: |
  Must use the "discount service" SDK. Keep it simple and robust.
